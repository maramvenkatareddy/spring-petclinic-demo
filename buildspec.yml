version: 0.2
env:
  secrets-manager:
    LOGIN: sonarcreds:sonartoken
    HOST: sonarcreds:Host
    Organization: sonarcreds:Organization
    Project: sonarcreds:Project

phases:
  pre_build:
    commands:
      - apt-get update
      - apt-get install -y jq unzip wget
      - apt install openjdk-17-jdk -y
      - java -version
      - wget https://dlcdn.apache.org/maven/maven-3/3.9.10/binaries/apache-maven-3.9.10-bin.tar.gz
      - tar xzf apache-maven-3.9.10-bin.tar.gz
      - ln -s apache-maven-3.9.10 maven
      - export PATH=$PATH:$(pwd)/maven/bin
      - wget https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-3.3.0.1492-linux.zip
      - unzip sonar-scanner-cli-3.3.0.1492-linux.zip
      - export PATH=$PATH:$(pwd)/sonar-scanner-3.3.0.1492-linux/bin
  build:
    commands:
      - mvn test -Dtest=\!*PostgresIntegrationTests
      - mvn sonar:sonar -Dsonar.login=$LOGIN -Dsonar.host.url=$HOST -Dsonar.projectKey=$Project -Dsonar.organization=$Organization
      - sleep 5
      - curl https://sonarcloud.io/api/qualitygates/project_status?projectKey=$Project > result.json
      - cat result.json
      - if [ $(jq -r '.projectStatus.status' result.json) = ERROR ] ; then $CODEBUILD_BUILD_SUCCEEDING -eq 0 ;fi
