version: 0.2
env:
  variables:
    REGION: ap-south-1
    ECR_REPO: 058114833030.dkr.ecr.ap-south-1.amazonaws.com/nginx
phases:
  install:
    commands:
      - echo "Installing yq..."
      - curl -L https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/bin/yq
      - chmod +x /usr/bin/yq
      - yq --version
      - echo Installing essentials...
      - echo Logging in to ECR...
      - docker buildx version
      - docker buildx create --use --name multi-builder || docker buildx use multi-builder
      - docker buildx inspect --bootstrap
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION)
      - echo "The latest commit hash is $COMMIT_HASH"
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 058114833030.dkr.ecr.ap-south-1.amazonaws.com

  build:
    commands:
      - echo Building Docker image from directory...
      - ls -al
      - docker buildx build --platform linux/amd64,linux/arm64 -t $ECR_REPO:$COMMIT_HASH -t $ECR_REPO:$COMMIT_HASH --push -f Dockerfile-nginx .
      - cd eks
      - "sed -i \"s|image: .*|image: ${ECR_REPO}:${COMMIT_HASH}|\" deployment.yaml"
      - cat deployment.yaml
      - git config --global user.email "venkat@gmail.com"
      - git config --global user.name "venkat"
      - BRANCH=$(echo $CODEBUILD_SOURCE_VERSION | sed 's|refs/heads/||')
      - echo "the current branch is $BRANCH"
      - git add .
      - git commit -m "updated image"
      - export BRANCH=$(echo $CODEBUILD_SOURCE_VERSION | sed 's|refs/heads/||')
      - export GITHUB_TOKEN=$(aws secretsmanager get-secret-value --secret-id token --query SecretString --output text | jq -r '.GITHUB_TOKEN')
      - git remote set-url origin https://maramvenkatareddy:${GITHUB_TOKEN}@github.com/maramvenkatareddy/sample-project.git
      - git remote -v
      - git push origin HEAD:main
